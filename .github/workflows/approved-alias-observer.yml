name: Approved public alias observer (read-only)

"on":
  pull_request:
    paths:
      - 'scripts/observe_aliases.py'
      - 'scripts/test_observe_aliases.py'
      - 'monitoring/**'
      - '.github/workflows/approved-alias-observer.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/observe_aliases.py'
      - 'scripts/test_observe_aliases.py'
      - 'monitoring/**'
      - '.github/workflows/approved-alias-observer.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      retain_report:
        description: "Upload tiny report artifact only after checking shared storage allowance"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: approved-alias-observer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    if: ${{ github.event.repository.private == false && (github.event_name != 'schedule' || vars.ZION_ALIAS_OBSERVER_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline observer regressions (no live probes)
        run: python3 -m unittest discover -s scripts -p 'test_observe_aliases.py' -v

  observe:
    needs: offline
    if: ${{ github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ZION_ALIAS_OBSERVER_ENABLED == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Observe approved HTTPS roots
        run: python3 scripts/observe_aliases.py
      - name: Publish summary
        if: always()
        run: |
          if test -f alias-report/report.md; then
            cat alias-report/report.md >> "$GITHUB_STEP_SUMMARY"
            cat alias-report/report.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && inputs.retain_report }}
        with:
          name: approved-alias-report-${{ github.run_id }}
          path: alias-report/
          if-no-files-found: error
          retention-days: 3
