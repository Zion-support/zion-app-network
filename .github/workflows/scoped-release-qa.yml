name: Read-only multilingual release QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published language paths, interlinks and stylesheets
        run: python scripts/verify-network-release.py --output release-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multilingual-release-verification
          path: release-verification.json
