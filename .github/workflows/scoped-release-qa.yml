name: Read-only multilingual release QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-network-release.py'
      - 'scripts/test_verify_network_release.py'
      - '.github/workflows/scoped-release-qa.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test multilingual release logic without network
        run: python3 -m unittest discover -s scripts -p 'test_verify_network_release.py' -v
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published language paths, interlinks and stylesheets
        run: python scripts/verify-network-release.py --output release-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multilingual-release-verification
          path: release-verification.json
