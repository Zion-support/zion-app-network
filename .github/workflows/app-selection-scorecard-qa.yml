name: App Selection Evidence Scorecard QA
on:
  pull_request:
    paths:
      - 'app-selection-evidence-scorecard-2026*'
      - 'index.html'
      - 'README.md'
      - 'docs/BUYER-JOURNEY-I18N-2026-10-28.md'
      - 'scripts/test_app_selection_scorecard.py'
      - '.github/workflows/app-selection-scorecard-qa.yml'
  push:
    branches: [main]
    paths:
      - 'app-selection-evidence-scorecard-2026*'
      - 'index.html'
      - 'README.md'
      - 'docs/BUYER-JOURNEY-I18N-2026-10-28.md'
      - 'scripts/test_app_selection_scorecard.py'
      - '.github/workflows/app-selection-scorecard-qa.yml'
permissions:
  contents: read
jobs:
  source-contract:
    name: Offline five-language source contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate five localized pages, interlinks and no remote data transmission
        run: python3 -m unittest discover -s scripts -p 'test_app_selection_scorecard.py' -v
      - name: Verify private calculator JavaScript syntax
        run: node --check app-selection-evidence-scorecard-2026.js
