name: Consolidate approved communications catalog
on:
  pull_request:
    paths:
      - 'scripts/consolidate-communications.py'
      - 'scripts/test-consolidate-communications.py'
      - '.github/workflows/consolidate-communications.yml'
  push:
    branches: [main]
    paths:
      - scripts/consolidate-communications.py
      - scripts/test-consolidate-communications.py
      - .github/workflows/consolidate-communications.yml
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: communications-catalog-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline Liquid, legacy HTML and failure-mode fixtures
        run: python3 -m unittest discover -s scripts -p 'test-consolidate-communications.py' -v
      - name: Test real catalog and Liquid homepage on disposable copies
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp CATALOG.md APPS_INDEX.md index.html "$tmp/"
          (
            cd "$tmp"
            python3 "$GITHUB_WORKSPACE/scripts/consolidate-communications.py"
            sha256sum CATALOG.md APPS_INDEX.md index.html > before.sha
            python3 "$GITHUB_WORKSPACE/scripts/consolidate-communications.py"
            sha256sum --check before.sha
            python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          assert text.count('id="communications-suite"') == 1
          assert '{% capture communicationsSuite %}' in text
          assert "opsEvidence2026 | replace: '</body>', communicationsSuite }}" in text
          print('PASS: Liquid homepage idempotent, existing captures preserved')
          PY
          )

  consolidate:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - name: Test standalone and Liquid hub edits offline
        run: python3 -m unittest discover -s scripts -p 'test-consolidate-communications.py' -v
      - name: Apply additive catalog updates and truthful Discovery messaging
        run: python3 scripts/consolidate-communications.py
      - name: Validate idempotency
        run: |
          sha256sum CATALOG.md APPS_INDEX.md index.html > /tmp/communications-before.sha
          python3 scripts/consolidate-communications.py
          sha256sum --check /tmp/communications-before.sha
      - name: Commit only scoped content files
        run: |
          if git diff --quiet -- CATALOG.md APPS_INDEX.md index.html; then
            echo 'Approved content is already consolidated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CATALOG.md APPS_INDEX.md index.html
          git commit -m 'fix(content): sync communications apps and correct Discovery promises'
          git push origin HEAD:main
