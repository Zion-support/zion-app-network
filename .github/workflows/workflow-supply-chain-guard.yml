name: Workflow supply-chain guard

"on":
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/workflow_supply_chain_guard.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/workflow_supply_chain_guard.py'
  schedule:
    - cron: '47 14 * * 4'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks only; never cancel main-push or weekly supply-chain checks.
concurrency:
  group: workflow-supply-chain-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/workflow_supply_chain_guard.py
